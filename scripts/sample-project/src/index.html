<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harbor</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- The table is filled in by schedule.ts -->
    <header class="masthead">
      <h1>Harbor</h1>
      <nav aria-label="Sections">
        <a href="#berths" class="active">Berths</a>
        <a href="#arrivals">Arrivals</a>
      </nav>
    </header>

    <main id="berths">
      <table data-berths="4">
        <thead>
          <tr>
            <th scope="col">Vessel</th>
            <th scope="col">Berth</th>
            <th scope="col">Until</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <button type="button" id="refresh" disabled>Refresh</button>
    </main>

    <script type="module" src="./schedule.ts"></script>
  </body>
</html>
